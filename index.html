<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta

  name="viewport"

  content="width=device-width, initial-scale=1.0, viewport-fit=cover"

>

<title>GOLF GUTS | 球筋診断</title>

<style>

/* ========================================

   BASIC

======================================== */

* {

  box-sizing: border-box;

  margin: 0;

  padding: 0;

}

:root {

  --bg: #f7f4ed;

  --card: #fffdf8;

  --black: #171512;

  --green: #174f3d;

  --green2: #26745b;

  --gray: #74716b;

  --line: #dedbd3;

  --soft-green: #e8efe9;

}

html {

  scroll-behavior: smooth;

}

body {

  background: var(--bg);

  color: var(--black);

  font-family:

    -apple-system,

    BlinkMacSystemFont,

    "Helvetica Neue",

    "Hiragino Kaku Gothic ProN",

    "Yu Gothic",

    "YuGothic",

    sans-serif;

  padding-top: 104px;

  min-height: 100vh;

}

/* ========================================

   FIXED HEADER

======================================== */

.site-header {

  position: fixed;

  top: 0;

  left: 0;

  right: 0;

  height: 104px;

  z-index: 1000;

  display: flex;

  align-items: center;

  justify-content: center;

  background: rgba(247, 244, 237, 0.96);

  border-bottom: 1px solid rgba(23,21,18,.08);

  backdrop-filter: blur(12px);

  -webkit-backdrop-filter: blur(12px);

}

.logo-image {

  display: block;

  width: min(310px, 68vw);

  height: auto;

  object-fit: contain;

}

/* ========================================

   PAGE

======================================== */

.page {

  width: min(100%, 760px);

  margin: 0 auto;

  padding:

    48px

    20px

    90px;

}

/* ========================================

   HERO

======================================== */

.hero {

  text-align: center;

  padding:

    20px

    0

    38px;

}

.eyebrow {

  display: inline-block;

  color: var(--green);

  font-size: 11px;

  font-weight: 800;

  letter-spacing: .25em;

  margin-bottom: 17px;

}

.hero h1 {

  font-size: clamp(31px, 7vw, 48px);

  line-height: 1.25;

  letter-spacing: -.04em;

  margin-bottom: 17px;

}

.hero p {

  color: var(--gray);

  font-size: 15px;

  line-height: 1.9;

}

/* ========================================

   PROGRESS

======================================== */

.progress-wrap {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 8px;

  margin-bottom: 22px;

}

.progress {

  width: 62px;

  height: 4px;

  border-radius: 99px;

  background: #d8d5cd;

  transition: .3s;

}

.progress.active {

  background: var(--green);

}

/* ========================================

   QUESTION CARD

======================================== */

.card {

  background: var(--card);

  border: 1px solid rgba(23,21,18,.07);

  border-radius: 26px;

  padding: 30px 25px;

  margin-bottom: 20px;

  box-shadow:

    0 14px 45px

    rgba(34, 31, 25, .055);

}

.step {

  display: inline-flex;

  align-items: center;

  padding: 7px 12px;

  border-radius: 999px;

  background: var(--soft-green);

  color: var(--green);

  font-size: 11px;

  font-weight: 800;

  letter-spacing: .12em;

  margin-bottom: 15px;

}

.card h2 {

  font-size: 24px;

  line-height: 1.45;

  letter-spacing: -.02em;

  margin-bottom: 9px;

}

.help {

  color: var(--gray);

  font-size: 14px;

  line-height: 1.8;

  margin-bottom: 24px;

}

/* ========================================

   OPTIONS

======================================== */

.options {

  display: grid;

  gap: 11px;

}

.option {

  width: 100%;

  appearance: none;

  -webkit-appearance: none;

  border: 1px solid var(--line);

  border-radius: 17px;

  background: #fff;

  color: var(--black);

  padding: 18px 19px;

  cursor: pointer;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 14px;

  text-align: left;

  transition:

    transform .18s ease,

    border-color .18s ease,

    background .18s ease,

    box-shadow .18s ease;

}

.option-main {

  display: flex;

  align-items: center;

  gap: 14px;

}

.direction {

  width: 39px;

  height: 39px;

  flex: 0 0 39px;

  display: grid;

  place-items: center;

  border-radius: 50%;

  background: var(--soft-green);

  color: var(--green);

  font-size: 20px;

  transition: .18s;

}

.option-text strong {

  display: block;

  font-size: 17px;

  margin-bottom: 3px;

}

.option-text small {

  display: block;

  color: var(--gray);

  font-size: 12px;

  font-weight: 500;

}

.chevron {

  color: #aaa69e;

  font-size: 22px;

}

.option:hover {

  transform: translateY(-2px);

  border-color: var(--green);

  box-shadow:

    0 10px 24px

    rgba(23,79,61,.08);

}

.option.selected {

  background: var(--green);

  border-color: var(--green);

  color: white;

}

.option.selected .direction {

  background: rgba(255,255,255,.15);

  color: white;

}

.option.selected small {

  color: rgba(255,255,255,.72);

}

.option.selected .chevron {

  color: white;

}

/* ========================================

   RESULT

======================================== */

#result-section {

  display: none;

  margin-top: 20px;

}

.result {

  position: relative;

  overflow: hidden;

  background:

    linear-gradient(

      145deg,

      #102d24 0%,

      #174f3d 100%

    );

  color: white;

  border-radius: 28px;

  padding: 32px 25px;

  box-shadow:

    0 20px 55px

    rgba(16,45,36,.18);

}

.result::before {

  content: "";

  position: absolute;

  width: 210px;

  height: 210px;

  border-radius: 50%;

  right: -110px;

  top: -110px;

  background:

    rgba(255,255,255,.055);

}

.result-label {

  position: relative;

  color: #a9cabc;

  font-size: 11px;

  font-weight: 800;

  letter-spacing: .22em;

  margin-bottom: 12px;

}

.result-title {

  position: relative;

  font-size: 30px;

  line-height: 1.3;

  margin-bottom: 7px;

}

.result-flight {

  position: relative;

  color: rgba(255,255,255,.75);

  font-size: 16px;

  margin-bottom: 28px;

}

/* ========================================

   RESULT BOXES

======================================== */

.result-grid {

  position: relative;

  display: grid;

  grid-template-columns:

    repeat(2, minmax(0,1fr));

  gap: 12px;

}

.result-box {

  min-height: 126px;

  padding: 19px;

  border-radius: 18px;

  background:

    rgba(255,255,255,.085);

  border:

    1px solid

    rgba(255,255,255,.12);

}

.result-box-label {

  color: #b8cdc4;

  font-size: 12px;

  margin-bottom: 11px;

}

.result-value {

  font-size: 24px;

  font-weight: 800;

}

/* ========================================

   RESULT EXPLANATION

======================================== */

.result-explanation {

  position: relative;

  margin-top: 14px;

  padding: 19px;

  border-radius: 18px;

  background:

    rgba(255,255,255,.07);

  color: rgba(255,255,255,.88);

  font-size: 14px;

  line-height: 1.9;

}

.result-explanation strong {

  color: white;

}

/* ========================================

   RESET

======================================== */

.reset {

  position: relative;

  width: 100%;

  margin-top: 18px;

  padding: 17px;

  border: 0;

  border-radius: 16px;

  background: white;

  color: var(--green);

  font-size: 15px;

  font-weight: 800;

  cursor: pointer;

}

/* ========================================

   GUIDE

======================================== */

.guide {

  margin-top: 28px;

  padding: 22px;

  border-top:

    1px solid

    var(--line);

  color: var(--gray);

  font-size: 13px;

  line-height: 1.9;

}

.guide strong {

  color: var(--black);

}

/* ========================================

   FOOTER

======================================== */

.footer {

  text-align: center;

  margin-top: 50px;

  color: #9a968e;

  font-size: 10px;

  letter-spacing: .17em;

}

/* ========================================

   ANIMATION

======================================== */

.fade-in {

  animation:

    fadeIn .38s ease both;

}

@keyframes fadeIn {

  from {

    opacity: 0;

    transform: translateY(12px);

  }

  to {

    opacity: 1;

    transform: translateY(0);

  }

}

/* ========================================

   MOBILE

======================================== */

@media (max-width: 600px) {

  body {

    padding-top: 88px;

  }

  .site-header {

    height: 88px;

  }

  .logo-image {

    width: min(270px, 73vw);

  }

  .page {

    padding:

      28px

      15px

      70px;

  }

  .hero {

    padding-top: 13px;

  }

  .hero h1 {

    font-size: 31px;

  }

  .card {

    padding:

      25px

      18px;

    border-radius: 22px;

  }

  .card h2 {

    font-size: 21px;

  }

  .option {

    padding:

      16px

      15px;

  }

  .result {

    padding:

      27px

      19px;

    border-radius: 23px;

  }

  .result-title {

    font-size: 27px;

  }

}

/* ========================================

   VERY SMALL PHONE

======================================== */

@media (max-width: 390px) {

  .result-grid {

    grid-template-columns: 1fr;

  }

}

</style>

</head>
