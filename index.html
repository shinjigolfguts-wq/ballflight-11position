<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GOLF GUTS | 球筋診断</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#102e25;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}button{font:inherit}.app{max-width:900px;margin:auto;padding:0 0 50px}.screen{display:none}.screen.active{display:block}.map{position:relative;width:100%;line-height:0}.map img{width:100%;height:auto;display:block}.hit{position:absolute;border:0;background:transparent;border-radius:4%;cursor:pointer;-webkit-tap-highlight-color:rgba(255,255,255,.22)}.hit:active{background:rgba(255,255,255,.18)}.left{left:4.5%;top:29%;width:29.5%;height:40%}.center{left:35.5%;top:29%;width:29%;height:40%}.right{left:66%;top:29%;width:29.5%;height:40%}.shank{left:26%;top:72%;width:49%;height:13%}.panel{margin:18px 14px;background:#fff;border-radius:24px;padding:22px;box-shadow:0 12px 30px #00000012}.badge{display:inline-block;padding:8px 14px;border-radius:999px;background:#e7f0eb;font-weight:800;letter-spacing:2px}.title{font-size:28px;margin:14px 0 4px}.sub{color:#6d716e;margin:0 0 20px}.choiceGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{min-height:170px;border:0;border-radius:20px;background:#fff;box-shadow:0 5px 18px #0002;padding:14px 6px;font-weight:800;cursor:pointer}.choice .arr{display:block;font-size:70px;line-height:1.1;color:#087f55}.choice small{display:block;color:#777;margin-top:5px}.back,.restart{width:100%;border:0;border-radius:15px;padding:15px;margin-top:18px;font-weight:800}.back{background:#eeeae1}.restart{background:#0c513d;color:#fff}.resultHead{background:#0c513d;color:#fff;padding:14px;border-radius:18px 18px 0 0;text-align:center;font-weight:900}.resultBody{background:#fff;padding:22px;border-radius:0 0 18px 18px}.resultBody h2{font-size:32px;text-align:center;margin:0 0 5px}.flight{text-align:center;color:#666;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#f6f5f0;border-radius:14px;padding:15px}.box small{color:#777}.box b{display:block;margin-top:6px;font-size:20px;color:#0c513d}.note{margin-top:12px;padding:15px;background:#edf4ef;border-radius:14px;line-height:1.7}.shankResult li{margin:10px 0;padding:13px;background:#f4edf5;border-radius:12px;font-weight:800;color:#642b6c}@media(max-width:520px){.choiceGrid{gap:6px}.choice{min-height:150px;font-size:14px}.choice .arr{font-size:58px}.panel{margin:12px 10px;padding:16px}.grid{grid-template-columns:1fr}.title{font-size:24px}}
</style></head><body><main class="app">
<section id="s1" class="screen active"><div class="map"><img src="step1.jpeg" alt="出球方向を選ぶ球筋診断"><button class="hit left" data-start="pull" aria-label="左に出る"></button><button class="hit center" data-start="straight" aria-label="真っ直ぐ出る"></button><button class="hit right" data-start="push" aria-label="右に出る"></button><button id="shank" class="hit shank" aria-label="シャンク"></button></div></section>
<section id="s2" class="screen"><div class="panel"><span class="badge">STEP 02</span><h1 class="title" id="selected"></h1><p class="sub">その後のボールの曲がり方を選んでください。</p><div class="choiceGrid"><button class="choice" data-curve="hook"><span class="arr">↖</span>フック<small>左に曲がる</small></button><button class="choice" data-curve="straight"><span class="arr">↑</span>ストレート<small>そのまま</small></button><button class="choice" data-curve="slice"><span class="arr">↗</span>スライス<small>右に曲がる</small></button></div><button class="back" id="back">← 出球の選択に戻る</button></div></section>
<section id="result" class="screen"><div class="panel" style="padding:0"><div class="resultHead">診断結果</div><div class="resultBody"><h2 id="rt"></h2><div class="flight" id="rf"></div><div class="grid"><div class="box"><small>フェースの向き</small><b id="face"></b></div><div class="box"><small>クラブの通り道</small><b id="path"></b></div></div><div class="note" id="note"></div><button class="restart">最初から診断する</button></div></div></section>
<section id="shankResult" class="screen"><div class="panel"><span class="badge" style="color:#6d2777;background:#f4edf5">RESULT</span><h1 class="title" style="color:#6d2777">シャンク</h1><p class="sub">右に大きく飛び出すミス</p><ul class="shankResult"><li>ボールに近づいている</li><li>過度なフェースの向き</li><li>過度な軌道</li></ul><div class="note">シャンクは打点やインパクト時の状態など複数の要素が関係する可能性があります。上の3項目を確認の入口として使用してください。</div><button class="restart">最初から診断する</button></div></section>
</main><script>
const D={pull_hook:['プルフック','左に出て → 左に曲がる','左向き','インサイドアウト'],pull_straight:['プルストレート','左に出て → そのまま','左向き','インサイドアウト'],pull_slice:['プルスライス','左に出て → 右に曲がる','左向き','アウトサイドイン'],straight_hook:['ストレートフック','真っ直ぐ出て → 左に曲がる','やや左向き','インサイドアウト'],straight_straight:['ストレート（真っ直ぐ）','真っ直ぐ出て → そのまま','スクエア','ストレート'],straight_slice:['ストレートスライス','真っ直ぐ出て → 右に曲がる','やや右向き','アウトサイドイン'],push_hook:['プッシュフック','右に出て → 左に曲がる','右向き','インサイドアウト'],push_straight:['プッシュストレート','右に出て → そのまま','右向き','ストレート'],push_slice:['プッシュスライス','右に出て → 右に曲がる','右向き','アウトサイドイン']};
let start='';const ids=['s1','s2','result','shankResult'];function show(id){ids.forEach(x=>document.getElementById(x).classList.toggle('active',x===id));scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{start=b.dataset.start;document.getElementById('selected').textContent=start==='pull'?'左に出た':start==='straight'?'真っ直ぐ出た':'右に出た';show('s2')});document.querySelectorAll('[data-curve]').forEach(b=>b.onclick=()=>{const d=D[start+'_'+b.dataset.curve];if(!d)return;rt.textContent=d[0];rf.textContent=d[1];face.textContent=d[2];path.textContent=d[3];note.textContent='出球と曲がり方から、フェースの向きとクラブの通り道を整理した目安です。実際の球筋には打点など他の要素も影響します。';show('result')});document.getElementById('back').onclick=()=>show('s1');document.getElementById('shank').onclick=()=>show('shankResult');document.querySelectorAll('.restart').forEach(b=>b.onclick=()=>{start='';show('s1')});
</script></body></html>
