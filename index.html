<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>GOLF GUTS | 球筋診断</title>

<style>

*{box-sizing:border-box}

body{

 margin:0;

 background:#f7f4ed;

 color:#171512;

 font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif;

}

header{

 position:sticky;

 top:0;

 z-index:100;

 height:95px;

 display:flex;

 align-items:center;

 justify-content:center;

 background:rgba(247,244,237,.97);

 border-bottom:1px solid #e2ded5;

}

header img{

 width:min(330px,78vw);

 height:auto;

}

main{

 max-width:700px;

 margin:auto;

 padding:25px 14px 60px;

}

.intro{

 text-align:center;

 margin-bottom:20px;

}

.intro small{

 color:#174f3d;

 font-weight:800;

 letter-spacing:3px;

}

.intro h1{

 font-size:30px;

 line-height:1.35;

 margin:12px 0 8px;

}

.intro p{

 margin:0;

 color:#77736c;

 font-size:14px;

 line-height:1.8;

}

/* 画像＋タップ領域 */

.map{

 position:relative;

 width:100%;

 margin-top:20px;

 background:#fff;

 border-radius:22px;

 overflow:hidden;

 box-shadow:0 12px 35px rgba(0,0,0,.06);

}

.map>img{

 display:block;

 width:100%;

 height:auto;

}

/* 透明タップボタン */

.hot{

 position:absolute;

 z-index:5;

 border:0;

 background:transparent;

 padding:0;

 cursor:pointer;

 -webkit-tap-highlight-color:rgba(23,79,61,.18);

}

/* タップ確認用の薄い円 */

.hot:active{

 background:rgba(23,79,61,.15);

 border-radius:50%;

}

/*

  画像上の10か所

  left / top / width / height は％指定

*/

/* プル① */

.p1{

 left:2%;

 top:40%;

 width:18%;

 height:13%;

}

/* プル② */

.p2{

 left:10%;

 top:33%;

 width:17%;

 height:12%;

}

/* プル③ */

.p3{

 left:20%;

 top:25%;

 width:16%;

 height:13%;

}

/* ストレート① */

.s1{

 left:32%;

 top:18%;

 width:15%;

 height:13%;

}

/* ストレート② */

.s2{

 left:43%;

 top:15%;

 width:15%;

 height:14%;

}

/* ストレート③ */

.s3{

 left:54%;

 top:18%;

 width:15%;

 height:13%;

}

/* プッシュ① */

.r1{

 left:65%;

 top:25%;

 width:15%;

 height:13%;

}

/* プッシュ② */

.r2{

 left:73%;

 top:33%;

 width:15%;

 height:12%;

}

/* プッシュ③ */

.r3{

 left:81%;

 top:40%;

 width:18%;

 height:13%;

}

/* シャンク */

.shank{

 left:68%;

 top:68%;

 width:31%;

 height:18%;

}

/* 説明 */

.tap-help{

 text-align:center;

 color:#174f3d;

 font-size:13px;

 font-weight:700;

 margin:15px 0 25px;

}

/* 結果 */

#result{

 display:none;

 margin-top:20px;

 scroll-margin-top:115px;

}

.result-card{

 padding:25px 19px;

 border-radius:24px;

 background:linear-gradient(145deg,#102d24,#174f3d);

 color:#fff;

 box-shadow:0 18px 45px rgba(16,45,36,.18);

}

.result-label{

 color:#a9cabc;

 font-size:11px;

 font-weight:800;

 letter-spacing:3px;

}

#resultTitle{

 margin:10px 0 5px;

 font-size:30px;

}

#flight{

 color:rgba(255,255,255,.76);

 font-size:15px;

 line-height:1.7;

 margin-bottom:20px;

}

.grid{

 display:grid;

 grid-template-columns:1fr 1fr;

 gap:10px;

}

.box{

 padding:17px;

 border-radius:16px;

 background:rgba(255,255,255,.09);

 border:1px solid rgba(255,255,255,.12);

}

.box small{

 color:#b8cdc4;

 font-size:12px;

}

.value{

 margin-top:8px;

 font-size:23px;

 font-weight:800;

}

#detail{

 margin-top:11px;

 padding:16px;

 border-radius:16px;

 background:rgba(255,255,255,.07);

 font-size:14px;

 line-height:1.9;

}

#detail ul{

 margin:8px 0 0;

 padding-left:20px;

 line-height:2;

}

.reset{

 width:100%;

 margin-top:15px;

 padding:16px;

 border:0;

 border-radius:15px;

 background:#fff;

 color:#174f3d;

 font-size:14px;

 font-weight:800;

 cursor:pointer;

}

.note{

 margin-top:24px;

 padding-top:18px;

 border-top:1px solid #ddd9d0;

 color:#77736c;

 font-size:11px;

 line-height:1.8;

}

footer{

 margin-top:35px;

 text-align:center;

 color:#99958d;

 font-size:10px;

 letter-spacing:2px;

}

@media(max-width:390px){

 .grid{grid-template-columns:1fr}

 .intro h1{font-size:28px}

}

</style>

</head>

<body>

<header>

 <img

  src="IMG_0932.jpeg"

  alt="GOLF GUTS DESIGN YOUR GOLF LIFE"

 >

</header>

<main>

<section class="intro">

 <small>BALL FLIGHT DIAGNOSIS</small>

 <h1>

  矢印をタップして<br>

  球筋を診断

 </h1>

 <p>

  実際のボールに近い矢印を<br>

  直接タップしてください。

 </p>

</section>

<div class="map">

 <img

  src="7936824F-48EF-4A41-BE67-BC65E27B5B46.png"

  alt="ゴルフ球筋診断図"

 >

 <button class="hot p1" data-key="p1" aria-label="プル1"></button>

 <button class="hot p2" data-key="p2" aria-label="プル2"></button>

 <button class="hot p3" data-key="p3" aria-label="プル3"></button>

 <button class="hot s1" data-key="s1" aria-label="ストレート1"></button>

 <button class="hot s2" data-key="s2" aria-label="ストレート2"></button>

 <button class="hot s3" data-key="s3" aria-label="ストレート3"></button>

 <button class="hot r1" data-key="r1" aria-label="プッシュ1"></button>

 <button class="hot r2" data-key="r2" aria-label="プッシュ2"></button>

 <button class="hot r3" data-key="r3" aria-label="プッシュ3"></button>

 <button

  class="hot shank"

  data-key="shank"

  aria-label="シャンク">

 </button>

</div>

<div class="tap-help">

 ↑ 気になる矢印を直接タップ

</div>

<section id="result">

 <div class="result-card">

  <div class="result-label">

   YOUR RESULT

  </div>

  <h2 id="resultTitle"></h2>

  <div id="flight"></div>

  <div class="grid" id="normalBoxes">

   <div class="box">

    <small>フェースの向き</small>

    <div class="value" id="face"></div>

   </div>

   <div class="box">

    <small>クラブの通り道</small>

    <div class="value" id="path"></div>

   </div>

  </div>

  <div id="detail"></div>

  <button

   type="button"

   class="reset"

   id="reset">

   図に戻る

  </button>

 </div>

</section>

<div class="note">

 ※この診断は初心者にも分かりやすいように、

 球筋をフェースの向きとクラブの通り道を中心に整理しています。

 実際の球筋には打点など他の要素も影響します。

</div>

<footer>

 GOLF GUTS ・ DESIGN YOUR GOLF LIFE

</footer>

</main>

<script>

/* 診断内容 */

const DATA={

 p1:{

  title:"プル①",

  flight:"左に出て → 左に曲がる",

  face:"左向き",

  path:"内外"

 },

 p2:{

  title:"プル②",

  flight:"左に出て → そのまま",

  face:"左向き",

  path:"内外"

 },

 p3:{

  title:"プル③",

  flight:"左に出て → 右に曲がる",

  face:"左向き",

  path:"外内"

 },

 s1:{

  title:"ストレート①",

  flight:"真っ直ぐ → 左に曲がる",

  face:"真っ直ぐ",

  path:"内外"

 },

 s2:{

  title:"ストレート②",

  flight:"真っ直ぐ → そのまま",

  face:"真っ直ぐ",

  path:"真っ直ぐ"

 },

 s3:{

  title:"ストレート③",

  flight:"真っ直ぐ → 右に曲がる",

  face:"真っ直ぐ",

  path:"外内"

 },

 r1:{

  title:"プッシュ①",

  flight:"右に出て → 左に曲がる",

  face:"右向き",

  path:"内外"

 },

 r2:{

  title:"プッシュ②",

  flight:"右に出て → そのまま",

  face:"右向き",

  path:"真っ直ぐ"

 },

 r3:{

  title:"プッシュ③",

  flight:"右に出て → 右に曲がる",

  face:"右向き",

  path:"外内"

 }

};

/* 必要な要素 */

const result=

 document.getElementById("result");

const resultTitle=

 document.getElementById("resultTitle");

const flight=

 document.getElementById("flight");

const face=

 document.getElementById("face");

const path=

 document.getElementById("path");

const detail=

 document.getElementById("detail");

const normalBoxes=

 document.getElementById("normalBoxes");

/* 9種類の矢印 */

document

.querySelectorAll(".hot[data-key]")

.forEach(function(button){

 button.addEventListener("click",function(){

  const key=

   button.getAttribute("data-key");

  if(key==="shank"){

   showShank();

   return;

  }

  const d=DATA[key];

  if(!d){

   return;

  }

  normalBoxes.style.display="grid";

  resultTitle.textContent=d.title;

  flight.textContent=d.flight;

  face.textContent=d.face;

  path.textContent=d.path;

  detail.innerHTML=

   'フェースの向きは <strong>「'+

   d.face+

   '」</strong>、クラブの通り道は <strong>「'+

   d.path+

   '」</strong> と診断されます。';

  showResult();

 });

});

/* シャンク */

function showShank(){

 normalBoxes.style.display="none";

 resultTitle.textContent="シャンク";

 flight.textContent=

  "右方向へ大きく飛び出すミス";

 detail.innerHTML=

  '<strong>考えられる主な原因</strong>'+

  '<ul>'+

  '<li>ボールに近づいている</li>'+

  '<li>過度なフェースの向き</li>'+

  '<li>過度な軌道</li>'+

  '</ul>';

 showResult();

}

/* 結果表示 */

function showResult(){

 result.style.display="block";

 setTimeout(function(){

  result.scrollIntoView({

   behavior:"smooth",

   block:"start"

  });

 },80);

}

/* 図へ戻る */

document

.getElementById("reset")

.addEventListener("click",function(){

 result.style.display="none";

 document

 .querySelector(".map")

 .scrollIntoView({

  behavior:"smooth",

  block:"center"

 });

});

</script>

</body>

</html>
